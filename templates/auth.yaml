AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31
Description: Autenticacao de clientes em Lambda; rede e IAM pertencem ao bootstrap/base/banco.

Parameters:
  Environment:
    Type: String
    AllowedValues: [hom, prd]
  ArtifactCommit:
    Type: String
    AllowedPattern: '^[0-9a-f]{40}$'
    Description: Revisao publicada do codigo e deste template.
  WorkloadSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Duas subnets privadas de workloads em zonas distintas.
  AuthSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: SG reservado da autenticacao, administrado pela base.
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: SG PostgreSQL administrado pelo banco.
  ZipKey:
    Type: String
    AllowedPattern: '^sam/auth/(hom|prd)/.+$'
    Description: Chave S3 produzida pelo sam package e publicada com este template.

Resources:
  AuthLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/mecanica-${Environment}-auth'
      RetentionInDays: 7

  PostgresEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AuthSecurityGroupId
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      Description: PostgreSQL privado do ambiente

  HttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AuthSecurityGroupId
      CidrIp: 0.0.0.0/0
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      Description: SSM, Secrets Manager, Invoke Lambda e OTLP externo via NAT existente

  AuthFunction:
    Type: AWS::Serverless::Function
    DependsOn: [PostgresEgress, HttpsEgress]
    Properties:
      FunctionName: !Sub 'mecanica-${Environment}-auth'
      Description: !Sub 'Autenticacao por codigo e emissao JWT - ${ArtifactCommit}'
      CodeUri: ../AuthFunction/
      PackageType: Zip
      Runtime: dotnet10
      Architectures: [x86_64]
      Tracing: Active
      Layers:
        - 'arn:aws:lambda:us-east-1:184161586896:layer:opentelemetry-collector-amd64-0_22_0:1'
      Handler: GerenciamentoMecanica.Autenticacao.Function::GerenciamentoMecanica.Autenticacao.Function.FunctionHandler::HandleAsync
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mecanica-${Environment}-auth-runtime'
      VpcConfig:
        SubnetIds: !Ref WorkloadSubnetIds
        SecurityGroupIds: [!Ref AuthSecurityGroupId]
      MemorySize: 512
      Timeout: 15
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      Environment:
        Variables:
          Runtime__Environment: !Ref Environment
          Telemetry__Enabled: 'true'
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
          OPENTELEMETRY_COLLECTOR_CONFIG_URI: /var/task/Observability/collector.yaml
          NEW_RELIC_LICENSE_KEY_SECRET: !Sub '/mecanica/${Environment}/observability/newrelic-license-key'
          GOMEMLIMIT: 96MiB
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref AuthLogs
        ApplicationLogLevel: INFO
        SystemLogLevel: INFO
      Tags:
        Project: mecanica
        Environment: !Ref Environment
        Component: auth
        ManagedBy: CloudFormation

  FunctionNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mecanica/${Environment}/auth/v2/function-name'
      Type: String
      Tier: Standard
      Value: !Ref AuthFunction

  FunctionVersionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mecanica/${Environment}/auth/v2/function-version'
      Type: String
      Tier: Standard
      Value: !GetAtt AuthFunction.Version.Version

  InvocationArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mecanica/${Environment}/auth/v2/invocation-arn'
      Type: String
      Tier: Standard
      Value: !Ref AuthFunction.Version

  ZipKeyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mecanica/${Environment}/auth/v2/zip-key'
      Type: String
      Tier: Standard
      Value: !Ref ZipKey

  OpenApiKeyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mecanica/${Environment}/auth/v2/openapi-key'
      Type: String
      Tier: Standard
      Value: !Sub 'contracts/auth/${ArtifactCommit}/openapi.json'

  ContractsVersionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mecanica/${Environment}/auth/v2/auth-contracts-version'
      Type: String
      Tier: Standard
      Value: '1.0.0'

Outputs:
  FunctionName:
    Description: Nome da funcao do ambiente.
    Value: !Ref AuthFunction
  FunctionVersion:
    Description: Versao numerica publicada, sem $LATEST.
    Value: !GetAtt AuthFunction.Version.Version
  InvocationArn:
    Description: ARN qualificado pela versao numerica para o Gateway.
    Value: !Ref AuthFunction.Version
  ZipKey:
    Description: Chave S3 do ZIP empacotado pelo SAM.
    Value: !Ref ZipKey

