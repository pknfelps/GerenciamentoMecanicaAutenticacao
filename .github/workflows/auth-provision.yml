name: auth-provision
run-name: auth-provision / ${{ inputs.environment }} / ${{ inputs.artifact_commit }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Destino: develop/hom ou main/prd'
        required: true
        default: hom
        type: choice
        options: [hom, prd]
      artifact_commit:
        description: 'SHA completo do artefato publicado'
        required: true
        type: string
        
permissions: {}
concurrency:
  group: auth-${{ inputs.environment }}
  cancel-in-progress: false
  
env:
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  ARTIFACT_COMMIT: ${{ inputs.artifact_commit }}
  TF_VAR_environment: ${{ inputs.environment }}
  TF_VAR_artifact_commit: ${{ inputs.artifact_commit }}
  AWS_REGION: us-east-1
  AWS_PAGER: ''
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_WORKSPACE: default
  CHECKPOINT_DISABLE: '1'
  
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.plan_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check branch and environment
        run: |
          case "$TARGET_ENVIRONMENT" in hom) branch=develop ;; prd) branch=main ;; *) exit 1 ;; esac
          test "$GITHUB_REF" = "refs/heads/$branch"
      - name: Check artifact commit ancestry
        run: git merge-base --is-ancestor -- "$ARTIFACT_COMMIT" "$GITHUB_SHA"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: auth-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Read published ZIP checksum
        run: |
          checksum="$(aws s3api head-object --bucket mecanica-artifacts-121754142617-us-east-1 \
            --expected-bucket-owner 121754142617 --key "lambda/$ARTIFACT_COMMIT/function.zip" \
            --checksum-mode ENABLED --query ChecksumSHA256 --output text)"
          echo "TF_VAR_zip_sha256_base64=$checksum" >> "$GITHUB_ENV"
      - name: Prepare Terraform
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend-config="backend.$TARGET_ENVIRONMENT.hcl" -lockfile=readonly
          terraform -chdir=terraform validate -no-color
      - name: Save plan
        run: terraform -chdir=terraform plan -no-color -lock-timeout=60s -out=tfplan
      - name: Present saved plan
        run: |
          terraform -chdir=terraform show -no-color tfplan | tee terraform/tfplan.txt
          {
            echo "Terraform commit: $GITHUB_SHA"
            echo "Function commit: $ARTIFACT_COMMIT"
            echo 'Review the complete tfplan.txt in the artifact before approval.'
            echo "Plan SHA-256: $(sha256sum terraform/tfplan | cut -d ' ' -f 1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: plan_artifact
        with:
          name: auth-provision-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            terraform/tfplan
            terraform/tfplan.txt
          if-no-files-found: error
          retention-days: 7

  approval:
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ format('{0}-approval', inputs.environment) }}
    permissions: {}
    steps:
      - run: echo 'Plano salvo desta execucao aprovado pelo Environment protegido.'

  apply:
    needs: [plan, approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: auth-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: terraform
          merge-multiple: true
      - name: Initialize approved backend
        run: terraform -chdir=terraform init -backend-config="backend.$TARGET_ENVIRONMENT.hcl" -lockfile=readonly
      - name: Apply approved plan
        run: terraform -chdir=terraform apply -no-color -lock-timeout=60s tfplan
      - name: Show public Terraform outputs
        run: terraform -chdir=terraform output -no-color
      - name: Show limited failure diagnostics
        if: failure()
        run: |
          aws lambda get-function-configuration --function-name "mecanica-$TARGET_ENVIRONMENT-auth" \
            --query '{FunctionName:FunctionName,Version:Version,State:State,StateReasonCode:StateReasonCode,LastUpdateStatus:LastUpdateStatus,LastUpdateStatusReasonCode:LastUpdateStatusReasonCode}' || true
          aws logs filter-log-events --log-group-name "/aws/lambda/mecanica-$TARGET_ENVIRONMENT-auth" \
            --limit 20 --no-paginate --query 'events[].message' || true

