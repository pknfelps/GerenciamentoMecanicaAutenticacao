name: reusable-destroy
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      environment:
        required: true
        type: string
permissions: {}
defaults:
  run:
    shell: bash
env:
  COMPONENT: ${{ inputs.component }}
  FUNCTION_RESOURCE: ${{ inputs.component == 'auth' && 'AuthFunction' || 'EmailFunction' }}
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  STACK_NAME: mecanica-${{ inputs.environment }}-${{ inputs.component }}
  AWS_REGION: us-east-1
  AWS_PAGER: ''
  SAM_CLI_TELEMETRY: '0'

jobs:
  destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check component and repository
        env:
          DEPLOY_ROLE_ARN: ${{ inputs.component == 'auth' && vars.AWS_ROLE_ARN || vars.AWS_EMAIL_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pknfelps/GerenciamentoMecanicaServerless
          case "$COMPONENT" in auth|email) ;; *) exit 1 ;; esac
          test "$DEPLOY_ROLE_ARN" = "arn:aws:iam::121754142617:role/mecanica/pipelines/mecanica-$TARGET_ENVIRONMENT-$COMPONENT-github"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check branch and environment
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in hom) branch=develop ;; prd) branch=main ;; *) exit 1 ;; esac
          test "$GITHUB_REF" = "refs/heads/$branch"
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          version: '1.167.0'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ inputs.component == 'auth' && vars.AWS_ROLE_ARN || vars.AWS_EMAIL_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: ${{ inputs.component }}-destroy-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check Gateway removal
        if: ${{ inputs.component == 'auth' }}
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in hom|prd) ;; *) exit 1 ;; esac
          test "$AWS_REGION" = us-east-1
          name="mecanica-$TARGET_ENVIRONMENT-gateway"
          apis="$(aws apigateway get-rest-apis --query "items[?name=='$name'].id" --output json)"
          if ! jq -e 'type == "array" and length == 0' <<< "$apis" > /dev/null; then
            echo "::error::$TARGET_ENVIRONMENT: REST API $name encontrada ou resposta invalida. Conclua gateway-destroy."
            exit 1
          fi
          links="$(aws apigatewayv2 get-vpc-links --query "Items[?Name=='$name'].VpcLinkId" --output json)"
          if ! jq -e 'type == "array" and length == 0' <<< "$links" > /dev/null; then
            echo "::error::$TARGET_ENVIRONMENT: VPC Link $name encontrado ou resposta invalida. Conclua gateway-destroy."
            exit 1
          fi

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        if: ${{ inputs.component == 'email' }}
        with:
          version: v1.36.1
      - name: Check API and authentication removal
        if: ${{ inputs.component == 'email' }}
        run: |
          set -euo pipefail
          functions="$(aws lambda list-functions --query "Functions[?FunctionName=='mecanica-$TARGET_ENVIRONMENT-auth'].FunctionName" --output json)"
          jq -e 'type == "array" and length == 0' <<< "$functions" > /dev/null || { echo '::error::Conclua auth-destroy antes de email-destroy.'; exit 1; }
          cluster="mecanica-$TARGET_ENVIRONMENT-eks"
          clusters="$(aws eks list-clusters --query clusters --output json)"
          jq -e 'type == "array" and all(.[]; type == "string")' <<< "$clusters" > /dev/null
          if jq -e --arg cluster "$cluster" 'index($cluster) != null' <<< "$clusters" > /dev/null; then
            export KUBECONFIG="$RUNNER_TEMP/email-destroy-kubeconfig"
            aws eks update-kubeconfig --name "$cluster" --kubeconfig "$KUBECONFIG"
            for resource in deployment/deploy-gerenciamento-api hpa/hpa-gerenciamento-api serviceaccount/gerenciamento-api; do
              found="$(kubectl get "$resource" --namespace default --ignore-not-found -o name)"
              test -z "$found" || { echo "::error::Conclua API destroy: $resource ainda existe."; exit 1; }
            done
            kubectl get pods,replicasets --namespace default -l app=gerenciamento-api -o json > "$RUNNER_TEMP/api-resources.json"
            jq -e '.items | type == "array" and length == 0' "$RUNNER_TEMP/api-resources.json" > /dev/null || { echo '::error::Conclua API destroy: pods/ReplicaSets ainda existem.'; exit 1; }
          fi

      - name: Delete component with SAM
        run: |
          set -euo pipefail
          sam delete \
            --config-env "$TARGET_ENVIRONMENT" \
            --config-file "$GITHUB_WORKSPACE/samconfig.$COMPONENT.toml" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-prompts
          echo "Recursos SAM removidos: $STACK_NAME; falta confirmar liberacao da rede. IAM persistente, bucket e contratos preservados." >> "$GITHUB_STEP_SUMMARY"
      - name: Check component network removal
        run: |
          set -euo pipefail

          groups="$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=mecanica-$TARGET_ENVIRONMENT-$COMPONENT" \
            --query 'SecurityGroups[].{Id:GroupId,Egress:IpPermissionsEgress}' --output json)"
          if ! jq -e 'type == "array" and all(.[]; (.Id | type == "string") and (.Egress | type == "array" and length == 0))' \
            <<< "$groups" > /dev/null; then
            echo "::error::$TARGET_ENVIRONMENT: regras de saida do componente remanescentes ou resposta invalida. Conclua $COMPONENT-destroy."
            exit 1
          fi
          group_ids="$(jq -r '.[].Id' <<< "$groups")"
          for group in $group_ids; do
            interfaces="$(aws ec2 describe-network-interfaces --filters "Name=group-id,Values=$group" \
              --query 'NetworkInterfaces[].NetworkInterfaceId' --output json)"
            if ! jq -e 'type == "array" and length == 0' <<< "$interfaces" > /dev/null; then
              echo "::error::$TARGET_ENVIRONMENT: ENIs do componente no SG $group pendentes ou resposta invalida. Aguarde a liberacao e repita $COMPONENT-destroy."
              exit 1
            fi
          done

          echo "Descarte $COMPONENT confirmado em $TARGET_ENVIRONMENT: sem ENIs ou regras de saida remanescentes." >> "$GITHUB_STEP_SUMMARY"
