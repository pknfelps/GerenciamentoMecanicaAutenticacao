name: auth-publish
run-name: auth-publish / ${{ inputs.environment }} / ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Destino: develop/hom ou main/prd'
        required: true
        default: hom
        type: choice
        options: [hom, prd]

permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: auth-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  AWS_REGION: us-east-1
  AWS_PAGER: ''
  DOTNET_NOLOGO: 'true'
  SAM_CLI_TELEMETRY: '0'

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check publication branch
        run: |
          case "$TARGET_ENVIRONMENT" in hom) branch=develop ;; prd) branch=main ;; *) exit 1 ;; esac
          test "$GITHUB_REF" = "refs/heads/$branch"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          version: '1.167.0'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: auth-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Download and verify Auth.Contracts 1.0.0
        env:
          PACKAGE_SHA256: b9080cea9d303722ac072e89421505d728126cdb52d57549da4328b1e18ab4e9
        run: |
          package=GerenciamentoMecanica.Auth.Contracts.1.0.0.nupkg
          key="packages/GerenciamentoMecanica.Auth.Contracts/1.0.0/$package"
          mkdir -p artifacts/auth-contracts
          aws s3api get-object --bucket mecanica-artifacts-121754142617-us-east-1 \
            --expected-bucket-owner 121754142617 --key "$key" "artifacts/auth-contracts/$package" > /dev/null
          aws s3api get-object --bucket mecanica-artifacts-121754142617-us-east-1 \
            --expected-bucket-owner 121754142617 --key "$key.sha256" "$RUNNER_TEMP/package.sha256" > /dev/null
          printf '%s\n' "$PACKAGE_SHA256" | cmp - "$RUNNER_TEMP/package.sha256"
          printf '%s  %s\n' "$PACKAGE_SHA256" "artifacts/auth-contracts/$package" | sha256sum --check --strict
          echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-$PACKAGE_SHA256" >> "$GITHUB_ENV"
      - name: Build and test the complete solution
        run: |
          docker info > /dev/null
          dotnet restore GerenciamentoMecanicaServerless.slnx
          dotnet build GerenciamentoMecanicaServerless.slnx -c Release --no-restore
          dotnet test GerenciamentoMecanicaServerless.slnx -c Release --no-build --no-restore
      - name: Build Function with SAM
        run: |
          sam validate --lint --template-file templates/auth.yaml
          sam build --template-file templates/auth.yaml
          test -s .aws-sam/build/AuthFunction/GerenciamentoMecanica.Autenticacao.Function.dll
          test -s .aws-sam/build/AuthFunction/GerenciamentoMecanica.Autenticacao.Function.deps.json
          test -s .aws-sam/build/AuthFunction/GerenciamentoMecanica.Autenticacao.Function.runtimeconfig.json
          test -s .aws-sam/build/AuthFunction/Certificates/rds-ca.pem
          test -s .aws-sam/build/AuthFunction/Observability/observability.json
          test -s .aws-sam/build/AuthFunction/Observability/collector.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: bundle
        with:
          name: auth-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .aws-sam/build/
            contracts/openapi.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          version: '1.167.0'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: auth-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: .
          merge-multiple: true
      - name: Package and upload Lambda with SAM
        run: |
          mkdir -p artifacts/bundle
          sam package --template-file .aws-sam/build/template.yaml \
            --s3-bucket mecanica-artifacts-121754142617-us-east-1 \
            --s3-prefix "sam/auth/$TARGET_ENVIRONMENT/$GITHUB_SHA" \
            --output-template-file "artifacts/bundle/sam-$TARGET_ENVIRONMENT.json" --use-json
          cp contracts/openapi.json artifacts/bundle/openapi.json
      - name: Pin and publish immutable SAM template
        run: |
          set -euo pipefail
          template="artifacts/bundle/sam-$TARGET_ENVIRONMENT.json"
          bucket=mecanica-artifacts-121754142617-us-east-1
          code_uri="$(jq -er '.Resources.AuthFunction.Properties.CodeUri | select(type == "string")' "$template")"
          prefix="s3://mecanica-artifacts-121754142617-us-east-1/"
          case "$code_uri" in
            "$prefix"*) zip_key="${code_uri#"$prefix"}" ;;
            *) echo "::error::CodeUri points to an unexpected bucket"; exit 1 ;;
          esac
          case "$zip_key" in "sam/auth/$TARGET_ENVIRONMENT/$GITHUB_SHA/"*) ;; *) exit 1 ;; esac
          version="$(aws s3api get-object --bucket "$bucket" \
            --expected-bucket-owner 121754142617 --key "$zip_key" \
            --query VersionId --output text "$RUNNER_TEMP/function.zip")"
          [[ -n "$version" && "$version" != null && "$version" != None ]] || {
            echo '::error::The Lambda ZIP must have an S3 VersionId.'
            exit 1
          }
          test -s "$RUNNER_TEMP/function.zip"
          jq --arg bucket "$bucket" --arg key "$zip_key" --arg version "$version" '
            .Resources.AuthFunction.Properties.CodeUri = {Bucket: $bucket, Key: $key, Version: $version}
          ' "$template" > "$RUNNER_TEMP/versioned-sam.json"
          mv "$RUNNER_TEMP/versioned-sam.json" "$template"

          # An identical republication must retain the version in the immutable template.
          template_key="contracts/auth/$GITHUB_SHA/sam-$TARGET_ENVIRONMENT.json"
          if template_version="$(aws s3api put-object --bucket "$bucket" \
            --expected-bucket-owner 121754142617 --key "$template_key" --body "$template" \
            --if-none-match '*' --checksum-algorithm SHA256 \
            --metadata "commit=$GITHUB_SHA,repository=$GITHUB_REPOSITORY" \
            --query VersionId --output text 2> "$RUNNER_TEMP/upload.err")"; then
            echo "Published $template_key"
          elif grep -q '(PreconditionFailed)' "$RUNNER_TEMP/upload.err"; then
            template_version="$(aws s3api get-object --bucket "$bucket" --expected-bucket-owner 121754142617 \
              --key "$template_key" --query VersionId --output text "$RUNNER_TEMP/published-sam.json")"
            jq -e --arg bucket "$bucket" --arg key "$zip_key" '
              .Resources.AuthFunction.Properties.CodeUri |
              type == "object" and .Bucket == $bucket and .Key == $key and
              (.Version | type == "string" and length > 0 and . != "null" and . != "None")
            ' "$RUNNER_TEMP/published-sam.json" > /dev/null || {
              echo '::error::The published template must pin the ZIP version. Publish a new commit.'
              exit 1
            }
            published_version="$(jq -er '.Resources.AuthFunction.Properties.CodeUri.Version' "$RUNNER_TEMP/published-sam.json")"
            aws s3api get-object --bucket "$bucket" --expected-bucket-owner 121754142617 \
              --key "$zip_key" --version-id "$published_version" \
              "$RUNNER_TEMP/published-function.zip" > /dev/null
            cmp "$RUNNER_TEMP/function.zip" "$RUNNER_TEMP/published-function.zip" || {
              echo '::error::The ZIP differs from the published revision. Publish a new commit.'
              exit 1
            }
            version="$published_version"
            jq --arg version "$version" '.Resources.AuthFunction.Properties.CodeUri.Version = $version' \
              "$template" > "$RUNNER_TEMP/versioned-sam.json"
            mv "$RUNNER_TEMP/versioned-sam.json" "$template"
            cmp "$template" "$RUNNER_TEMP/published-sam.json" || {
              echo "::error::Immutable artifact differs: $template_key"
              exit 1
            }
            echo "Identical artifact already exists: $template_key"
          else
            cat "$RUNNER_TEMP/upload.err" >&2
            exit 1
          fi

          for file in "sam-$TARGET_ENVIRONMENT.json" openapi.json; do
            sha256sum "artifacts/bundle/$file" | cut -d ' ' -f 1 > "artifacts/bundle/$file.sha256"
          done
          {
            echo "Commit do codigo e template: $GITHUB_SHA"
            echo "- $zip_key; SHA-256: $(sha256sum "$RUNNER_TEMP/function.zip" | cut -d ' ' -f 1); S3 version: $version"
            echo "- $template_key; SHA-256: $(cat "$template.sha256"); S3 version: $template_version"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish immutable SAM checksum
        working-directory: artifacts/bundle
        run: |
          file="sam-$TARGET_ENVIRONMENT.json.sha256"
          key="contracts/auth/$GITHUB_SHA/$file"
          if version="$(aws s3api put-object --bucket mecanica-artifacts-121754142617-us-east-1 \
            --expected-bucket-owner 121754142617 --key "$key" --body "$file" \
            --if-none-match '*' --checksum-algorithm SHA256 \
            --metadata "commit=$GITHUB_SHA,repository=$GITHUB_REPOSITORY" \
            --query VersionId --output text 2> "$RUNNER_TEMP/upload.err")"; then
            echo "Published $key"
          elif grep -q '(PreconditionFailed)' "$RUNNER_TEMP/upload.err"; then
            version="$(aws s3api get-object --bucket mecanica-artifacts-121754142617-us-east-1 \
              --expected-bucket-owner 121754142617 --key "$key" \
              --query VersionId --output text "$RUNNER_TEMP/existing")"
            cmp "$file" "$RUNNER_TEMP/existing" || { echo "::error::Immutable artifact differs: $key"; exit 1; }
            echo "Identical artifact already exists: $key"
          else
            cat "$RUNNER_TEMP/upload.err" >&2
            exit 1
          fi
          echo "- $key; SHA-256: $(sha256sum "$file" | cut -d ' ' -f 1); S3 version: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish immutable OpenAPI and checksum
        working-directory: artifacts/bundle
        run: |
          for file in openapi.json openapi.json.sha256; do
            key="contracts/auth/$GITHUB_SHA/$file"
            if version="$(aws s3api put-object --bucket mecanica-artifacts-121754142617-us-east-1 \
              --expected-bucket-owner 121754142617 --key "$key" --body "$file" \
              --if-none-match '*' --checksum-algorithm SHA256 \
              --metadata "commit=$GITHUB_SHA,repository=$GITHUB_REPOSITORY" \
              --query VersionId --output text 2> "$RUNNER_TEMP/upload.err")"; then
              echo "Published $key"
            elif grep -q '(PreconditionFailed)' "$RUNNER_TEMP/upload.err"; then
              version="$(aws s3api get-object --bucket mecanica-artifacts-121754142617-us-east-1 \
                --expected-bucket-owner 121754142617 --key "$key" \
                --query VersionId --output text "$RUNNER_TEMP/existing")"
              cmp "$file" "$RUNNER_TEMP/existing" || { echo "::error::Immutable artifact differs: $key"; exit 1; }
              echo "Identical artifact already exists: $key"
            else
              cat "$RUNNER_TEMP/upload.err" >&2
              exit 1
            fi
            echo "- $key; SHA-256: $(sha256sum "$file" | cut -d ' ' -f 1); S3 version: $version" >> "$GITHUB_STEP_SUMMARY"
          done
