name: auth-publish
run-name: auth-publish / ${{ inputs.environment }} / ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Destino: develop/hom ou main/prd'
        required: true
        default: hom
        type: choice
        options: [hom, prd]
        
permissions: {}
concurrency:
  group: auth-${{ inputs.environment }}
  cancel-in-progress: false
  
env:
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  AWS_REGION: us-east-1
  AWS_PAGER: ''
  DOTNET_NOLOGO: 'true'
  
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check publication branch
        run: |
          case "$TARGET_ENVIRONMENT" in hom) branch=develop ;; prd) branch=main ;; *) exit 1 ;; esac
          test "$GITHUB_REF" = "refs/heads/$branch"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: auth-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Download and verify Auth.Contracts 1.0.0
        env:
          PACKAGE_SHA256: b9080cea9d303722ac072e89421505d728126cdb52d57549da4328b1e18ab4e9
        run: |
          package=GerenciamentoMecanica.Auth.Contracts.1.0.0.nupkg
          key="packages/GerenciamentoMecanica.Auth.Contracts/1.0.0/$package"
          mkdir -p artifacts/auth-contracts
          aws s3api get-object --bucket mecanica-artifacts-121754142617-us-east-1 \
            --expected-bucket-owner 121754142617 --key "$key" "artifacts/auth-contracts/$package" > /dev/null
          aws s3api get-object --bucket mecanica-artifacts-121754142617-us-east-1 \
            --expected-bucket-owner 121754142617 --key "$key.sha256" "$RUNNER_TEMP/package.sha256" > /dev/null
          printf '%s\n' "$PACKAGE_SHA256" | cmp - "$RUNNER_TEMP/package.sha256"
          printf '%s  %s\n' "$PACKAGE_SHA256" "artifacts/auth-contracts/$package" | sha256sum --check --strict
          echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-$PACKAGE_SHA256" >> "$GITHUB_ENV"
      - name: Build and test the complete solution
        run: |
          docker info > /dev/null
          dotnet restore GerenciamentoMecanicaAutenticacao.slnx
          dotnet build GerenciamentoMecanicaAutenticacao.slnx -c Release --no-restore
          dotnet test GerenciamentoMecanicaAutenticacao.slnx -c Release --no-build --no-restore
      - name: Publish and package Function
        env:
          TZ: UTC
        run: |
          umask 022
          dotnet restore Function/Function.csproj -r linux-x64
          dotnet publish Function/Function.csproj -c Release -r linux-x64 --self-contained false --no-restore \
            -p:ContinuousIntegrationBuild=true -p:SourceRevisionId="$GITHUB_SHA" -o "$RUNNER_TEMP/function"
          test -s "$RUNNER_TEMP/function/GerenciamentoMecanica.Autenticacao.Function.dll"
          test -s "$RUNNER_TEMP/function/GerenciamentoMecanica.Autenticacao.Function.deps.json"
          test -s "$RUNNER_TEMP/function/GerenciamentoMecanica.Autenticacao.Function.runtimeconfig.json"
          test -s "$RUNNER_TEMP/function/Certificates/rds-ca.pem"
          mkdir -p artifacts/bundle
          cp contracts/openapi.json artifacts/bundle/openapi.json
          bundle="$GITHUB_WORKSPACE/artifacts/bundle"
          (
            cd "$RUNNER_TEMP/function"
            find . -type f -exec touch -t 198001010000 {} +
            find . -type f -printf '%P\n' | LC_ALL=C sort | zip -X -q "$bundle/function.zip" -@
          )
          unzip -t "$bundle/function.zip"
          for file in function.zip openapi.json; do
            sha256sum "$bundle/$file" | cut -d ' ' -f 1 > "$bundle/$file.sha256"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: bundle
        with:
          name: auth-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bundle/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: auth-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: artifacts/bundle
          merge-multiple: true
      - name: Verify bundle checksums
        working-directory: artifacts/bundle
        run: |
          for file in function.zip openapi.json; do
            hash="$(cat "$file.sha256")"
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "$hash" "$file" | sha256sum --check --strict
          done
      - name: Publish immutable Lambda ZIP and checksum
        working-directory: artifacts/bundle
        run: |
          for file in function.zip function.zip.sha256; do
            key="lambda/$GITHUB_SHA/$file"
            if version="$(aws s3api put-object --bucket mecanica-artifacts-121754142617-us-east-1 \
              --expected-bucket-owner 121754142617 --key "$key" --body "$file" \
              --if-none-match '*' --checksum-algorithm SHA256 \
              --metadata "commit=$GITHUB_SHA,repository=$GITHUB_REPOSITORY" \
              --query VersionId --output text 2> "$RUNNER_TEMP/upload.err")"; then
              echo "Published $key"
            elif grep -q '(PreconditionFailed)' "$RUNNER_TEMP/upload.err"; then
              version="$(aws s3api get-object --bucket mecanica-artifacts-121754142617-us-east-1 \
                --expected-bucket-owner 121754142617 --key "$key" \
                --query VersionId --output text "$RUNNER_TEMP/existing")"
              cmp "$file" "$RUNNER_TEMP/existing" || { echo "::error::Immutable artifact differs: $key"; exit 1; }
              echo "Identical artifact already exists: $key"
            else
              cat "$RUNNER_TEMP/upload.err" >&2
              exit 1
            fi
            echo "- $key; SHA-256: $(sha256sum "$file" | cut -d ' ' -f 1); S3 version: $version" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Publish immutable OpenAPI and checksum
        working-directory: artifacts/bundle
        run: |
          for file in openapi.json openapi.json.sha256; do
            key="contracts/auth/$GITHUB_SHA/$file"
            if version="$(aws s3api put-object --bucket mecanica-artifacts-121754142617-us-east-1 \
              --expected-bucket-owner 121754142617 --key "$key" --body "$file" \
              --if-none-match '*' --checksum-algorithm SHA256 \
              --metadata "commit=$GITHUB_SHA,repository=$GITHUB_REPOSITORY" \
              --query VersionId --output text 2> "$RUNNER_TEMP/upload.err")"; then
              echo "Published $key"
            elif grep -q '(PreconditionFailed)' "$RUNNER_TEMP/upload.err"; then
              version="$(aws s3api get-object --bucket mecanica-artifacts-121754142617-us-east-1 \
                --expected-bucket-owner 121754142617 --key "$key" \
                --query VersionId --output text "$RUNNER_TEMP/existing")"
              cmp "$file" "$RUNNER_TEMP/existing" || { echo "::error::Immutable artifact differs: $key"; exit 1; }
              echo "Identical artifact already exists: $key"
            else
              cat "$RUNNER_TEMP/upload.err" >&2
              exit 1
            fi
            echo "- $key; SHA-256: $(sha256sum "$file" | cut -d ' ' -f 1); S3 version: $version" >> "$GITHUB_STEP_SUMMARY"
          done
