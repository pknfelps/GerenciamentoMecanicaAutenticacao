name: auth-ci
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: auth-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/reusable-ci.yml
    permissions:
      contents: read
      id-token: write
    with:
      component: auth
  # Stable required check names, including when a called job fails or is canceled.
  dotnet:
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
  configuration:
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
