name: auth-destroy
run-name: auth-destroy / ${{ inputs.environment }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Descartar auth: develop/hom ou main/prd'
        required: true
        default: hom
        type: choice
        options: [hom, prd]
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: auth-${{ inputs.environment }}
  cancel-in-progress: false
env:
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  STACK_NAME: mecanica-${{ inputs.environment }}-auth
  AWS_REGION: us-east-1
  AWS_PAGER: ''
  SAM_CLI_TELEMETRY: '0'

jobs:
  destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check branch and environment
        run: |
          case "$TARGET_ENVIRONMENT" in hom) branch=develop ;; prd) branch=main ;; *) exit 1 ;; esac
          test "$GITHUB_REF" = "refs/heads/$branch"
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          version: '1.167.0'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: auth-destroy-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Delete authentication with SAM
        run: |
          sam delete \
            --config-env "$TARGET_ENVIRONMENT" \
            --config-file "$GITHUB_WORKSPACE/samconfig.toml" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-prompts
          echo "Descarte SAM concluido: $STACK_NAME. ZIP atual e templates operacionais removidos quando existentes; IAM persistente, bucket e contratos preservados." >> "$GITHUB_STEP_SUMMARY"
      - name: Check remaining network interfaces
        run: |
          auth_sgs="$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=mecanica-$TARGET_ENVIRONMENT-auth" \
            --query 'SecurityGroups[].GroupId' --output text)"
          for auth_sg in $auth_sgs; do
            aws ec2 describe-network-interfaces --filters "Name=group-id,Values=$auth_sg" \
              --query 'NetworkInterfaces[].{Id:NetworkInterfaceId,Status:Status,Type:InterfaceType,Managed:RequesterManaged}'
          done
          echo 'Conferir liberacao das ENIs antes de descartar banco/base.' >> "$GITHUB_STEP_SUMMARY"
