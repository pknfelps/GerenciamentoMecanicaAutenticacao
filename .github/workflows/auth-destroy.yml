name: auth-destroy
run-name: auth-destroy / ${{ inputs.environment }} / ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Develop/hom ou main/prd
        required: true
        default: hom
        type: choice
        options: [hom, prd]
permissions: {}
concurrency:
  group: auth-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  destroy:
    uses: ./.github/workflows/reusable-destroy.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      component: auth
      environment: ${{ inputs.environment }}
